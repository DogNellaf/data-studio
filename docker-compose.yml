# Локальное демо: приложение, воркер копий, база приложения, демонстрационная
# база «shop», с которой можно снимать копии, и SeaweedFS как S3-хранилище.
#
#     docker compose up --build
#
# Затем откройте http://localhost:8000 и войдите как demo / demo12345.
# В форме создания копии укажите: хост demo-db, порт 5432, база shop,
# пользователь shop, пароль shop. Хранилище — локальный диск или S3.
# Файлы в S3 видно в браузере файлов SeaweedFS: http://localhost:8888/buckets/

x-app-env: &app-env
  DATABASE_URL: postgres://datastudio:datastudio@app-db:5432/datastudio
  # Только для локального демо. В продакшене задайте свои ключи.
  DJANGO_SECRET_KEY: docker-compose-demo-key-change-me-0123456789abcdef
  BACKUP_CREDENTIALS_KEY: docker-compose-demo-credentials-key
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
  # Демо работает по HTTP, без TLS-прокси.
  DJANGO_SECURE_SSL_REDIRECT: "False"
  DJANGO_SECURE_HSTS_SECONDS: "0"
  DJANGO_SECURE_COOKIES: "False"
  DJANGO_TIME_ZONE: Europe/Moscow
  DEMO_USERNAME: demo
  DEMO_PASSWORD: demo12345
  BACKUP_S3_BUCKET: datastudio
  BACKUP_S3_PREFIX: backups
  BACKUP_S3_ENDPOINT_URL: http://s3:8333
  BACKUP_S3_REGION: us-east-1
  # Демо-хранилище запущено без проверки ключей; с настоящим S3 здесь
  # указываются выданные им ключи доступа.
  BACKUP_S3_ACCESS_KEY: demo
  BACKUP_S3_SECRET_KEY: demo-secret
  BACKUP_S3_ADDRESSING_STYLE: path

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment: *app-env
    volumes:
      - backups:/app/backups
    # Готовность — когда gunicorn отвечает, а не когда стартовал контейнер:
    # до этого entrypoint ещё применяет миграции. В образе нет curl.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/auth/login', timeout=3)"]
      interval: 3s
      timeout: 5s
      start_period: 10s
      retries: 20
    depends_on:
      app-db:
        condition: service_healthy
      demo-db:
        condition: service_healthy
      s3:
        condition: service_healthy

  # Снимает копии из очереди. Миграции применяет app, поэтому воркер ждёт его
  # готовности и запускается без entrypoint.
  worker:
    build: .
    entrypoint: []
    command: ["python", "manage.py", "backup_worker"]
    environment: *app-env
    volumes:
      - backups:/app/backups
    # Даём доснять текущую копию при docker compose stop.
    stop_grace_period: 2m
    depends_on:
      app:
        condition: service_healthy

  app-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: datastudio
      POSTGRES_USER: datastudio
      POSTGRES_PASSWORD: datastudio
    volumes:
      - app-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datastudio -d datastudio"]
      interval: 2s
      timeout: 3s
      retries: 30

  demo-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      # Чтобы менять данные из psql и смотреть, как это отражается в дельтах:
      #     psql postgres://shop:shop@localhost:5433/shop
      - "5433:5432"
    volumes:
      - ./docker/demo-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-совместимое хранилище SeaweedFS: S3 API на 8333, браузер файлов на 8888.
  s3:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-master.volumeSizeLimitMB=1024"]
    ports:
      - "8888:8888"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || nc -z 127.0.0.1 8333"]
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  app-db:
  backups:
  s3-data:
