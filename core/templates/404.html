{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Page not found" %}{% endblock %}
{% block body %}

    <div class="error-page__code">404</div>
    <h1>{% translate "Page not found" %}</h1>

  </div>
</main>
{% endblock %}
